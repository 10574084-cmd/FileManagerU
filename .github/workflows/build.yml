name: Build WiiU File Manager
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build RPX
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            wiiuenv/devkitppc-with-sdl2:latest \
            bash -c '
              set -euxo pipefail
              export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
              export DEVKITPPC="${DEVKITPPC:-$DEVKITPRO/devkitPPC}"
              export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/bin:$PATH"
              command -v powerpc-eabi-g++
              command -v cmake
              # Older wiiuenv images ship WUTs toolchain under wut/share.
              if [ -f "$DEVKITPRO/wut/share/wut.toolchain.cmake" ]; then
                TOOLCHAIN="$DEVKITPRO/wut/share/wut.toolchain.cmake"
              elif [ -f "$DEVKITPRO/cmake/WiiU.cmake" ]; then
                TOOLCHAIN="$DEVKITPRO/cmake/WiiU.cmake"
              else
                echo "No Wii U CMake toolchain found. WUT contents:" >&2
                find "$DEVKITPRO/wut" -maxdepth 4 -type f -print 2>/dev/null || true
                exit 1
              fi
              echo "Using Wii U toolchain: $TOOLCHAIN"
              cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DCMAKE_BUILD_TYPE=Release
              cmake --build build --parallel
            '

      - name: Check output
        shell: bash
        run: |
          set -euxo pipefail
          find build -type f -name '*.rpx' -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: WiiU-FileManager-RPX
          path: build/**/*.rpx
          if-no-files-found: error
