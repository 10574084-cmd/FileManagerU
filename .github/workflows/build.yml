name: Build WiiU File Manager
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build RPX
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            wiiuenv/devkitppc-with-sdl2:latest \
            bash -c '
              set -euxo pipefail
              export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
              export DEVKITPPC="${DEVKITPPC:-$DEVKITPRO/devkitPPC}"
              export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/bin:$PATH"
              CMAKE_WIIU="$DEVKITPRO/portlibs/wiiu/bin/powerpc-eabi-cmake"
              command -v powerpc-eabi-g++
              command -v cmake
              if [ ! -x "$CMAKE_WIIU" ]; then
                echo "Wii U CMake wrapper not found at $CMAKE_WIIU" >&2
                find "$DEVKITPRO" -maxdepth 6 -type f -name "powerpc-eabi-cmake" -print 2>/dev/null || true
                exit 1
              fi
              echo "Using Wii U CMake wrapper: $CMAKE_WIIU"
              "$CMAKE_WIIU" -S /work -B /work/build -DCMAKE_BUILD_TYPE=Release
              cmake --build /work/build --parallel
            '

      - name: Check output
        shell: bash
        run: |
          set -euxo pipefail
          find build -type f -name '*.rpx' -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: WiiU-FileManager-RPX
          path: build/**/*.rpx
          if-no-files-found: error
