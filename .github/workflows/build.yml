name: Build WiiU File Manager
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run the Wii U toolchain inside Docker, but keep Actions' Node-based
      # steps on the host. The builder image has an older libc than checkout
      # requires, so it must not be the job-level container.
      - name: Configure and build RPX
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            wiiuenv/devkitppc-with-sdl2:latest \
            bash -lc '
              set -euxo pipefail
              export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
              export DEVKITPPC="${DEVKITPPC:-$DEVKITPRO/devkitPPC}"
              test -f "$DEVKITPRO/portlibs/wiiu/include/SDL2/SDL.h" || find "$DEVKITPRO" -path "*/SDL2/SDL.h" -print -quit | grep -q .
              "$DEVKITPRO/portlibs/wiiu/bin/powerpc-eabi-cmake" -S . -B build
              cmake --build build --parallel
            '

      - name: Check output
        shell: bash
        run: |
          set -euxo pipefail
          find build -type f -name '*.rpx' -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: WiiU-FileManager-RPX
          path: build/**/*.rpx
          if-no-files-found: error
