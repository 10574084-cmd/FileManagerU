name: Build WiiU File Manager
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 portlib
        shell: bash
        run: |
          set -euxo pipefail
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm wiiu-sdl2
      - name: Build RPX
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake -S . -B build
          cmake --build build --parallel
      - name: Check output
        shell: bash
        run: |
          set -euxo pipefail
          find build -type f -name '*.rpx' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: WiiU-FileManager-RPX
          path: build/**/*.rpx
          if-no-files-found: error
