name: Build WiiU File Manager
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build RPX
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            wiiuenv/devkitppc-with-sdl2:latest \
            bash -c '
              set -euxo pipefail
              export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
              export DEVKITPPC="${DEVKITPPC:-$DEVKITPRO/devkitPPC}"
              export PATH="$DEVKITPPC/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/bin:$PATH"
              echo "DEVKITPRO=$DEVKITPRO"
              echo "DEVKITPPC=$DEVKITPPC"
              echo "PATH=$PATH"
              ls -la "$DEVKITPRO" || true
              find "$DEVKITPRO" -maxdepth 6 \( -name "powerpc-eabi-g++" -o -name "powerpc-eabi-cmake" -o -iname "*wiiu*.cmake" \) -print || true
              command -v powerpc-eabi-g++
              command -v cmake
              if command -v powerpc-eabi-cmake >/dev/null 2>&1; then
                powerpc-eabi-cmake -S . -B build
              elif [ -f "$DEVKITPRO/cmake/WiiU.cmake" ]; then
                cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/WiiU.cmake"
              elif [ -f "$DEVKITPRO/cmake/wiiu.cmake" ]; then
                cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/wiiu.cmake"
              else
                echo "Could not find powerpc-eabi-cmake or Wii U CMake toolchain file" >&2
                exit 1
              fi
              cmake --build build --parallel
            '

      - name: Check output
        shell: bash
        run: |
          set -euxo pipefail
          find build -type f -name '*.rpx' -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: WiiU-FileManager-RPX
          path: build/**/*.rpx
          if-no-files-found: error
